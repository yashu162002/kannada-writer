# Netlify configuration for Kannada Writer
# React + Vite + TypeScript application

[build]
  # Vite + TypeScript build command
  command = "npm run build"

  # Output directory - Vite outputs to dist/
  publish = "dist"

[redirects]
  # SPA routing: redirect all unmatched paths to /index.html
  /  = /index.html   200

[[headers]]
  # Security headers
  for = "/*"
    [headers]
      X-Frame-Options = "SAMEORIGIN"
      X-Content-Type-Options = "nosniff"
      X-XSS-Protection = "1; mode=block"
      Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  # Cache assets (never cache index.html)
  for = "/assets/*"
    [headers]
      Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  # Cache HTML with no-cache for dynamic content
  for = "/index.html"
    [headers]
      Cache-Control = "public, max-age=0, must-revalidate"

[build.environment]
  # Node version (Vite + React 18)
  NODE_VERSION = "20.11.0"

[[plugins]]
  # Netlify Identity (if needed)
  # name = "netlify-plugin-identity"

[[plugins]]
  # Netlify Analytics (if needed)
  # name = "netlify-plugin-analytics"